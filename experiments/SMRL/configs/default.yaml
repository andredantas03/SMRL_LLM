experiment:
  project: "SMRL"
  name: "Classification_Baseline"
  task: "classification"
  seed: 42

model:
  #type: 'SMRL_for_Sequence_Classification'
  type: 'SMRL'
  p: 4
  hidden_size: 128
  d_ff: 512
  vocab_size : 30000
  max_seq_length : &max_seq_len 128
  n_layer : 4
  n_head : 1
  H: 4
  dropout : 0.1
  kind: 'dct' # ['dct', 'dst', 'haar', 'dht', 'learnable']
  orth_lambda: 1.0

training:
  max_steps: 5000
  batch_size: 8
  lr: 3.0e-4
  lr_min: 1.0e-5
  weight_decay : 0.01
  warm_up_steps : 250
  gradient_clip_val: 1.0
  early_stopping:
    monitor: val_ppl
    mode: min
    patience: 5
    min_delta: 0.0
    stopping_threshold: 40.0

training_classification:
  max_epochs: 20
  batch_size: 128



logging:
  logging_steps : 50
  save_steps : 1000
  eval_steps : 2500
  limit_val_batches : 200

evaluation:
  metrics: ["accuracy", "f1"]

data_language_modeling:
  #dataset_name : "tinystoriesv2-gpt4"
  dataset_name : "wikitext103"
  output_raw_dir : "shared/data/raw/wikitext103"
  #output_raw_dir : "shared/data/raw/tinystoriesv2-gpt4"
  num_workers : 0
  output_processed_dir : "shared/data/processed/wikitext103"
  #output_processed_dir : "shared/data/processed/tinystoriesv2-gpt4"
  tokenized_dataset_path:
    train_dataset_path : "shared/data/processed/wikitext103/30000_hf/wikitext103-train.npy"
    valid_dataset_path : "shared/data/processed/wikitext103/30000_hf/wikitext103-validation.npy"
    test_dataset_path  : "shared/data/processed/wikitext103/30000_hf/wikitext103-test.npy"
#    train_dataset_path : "shared/data/processed/tinystoriesv2-gpt4/30000_hf/TinyStoriesV2-GPT4-train.npy"
#    valid_dataset_path : "shared/data/processed/tinystoriesv2-gpt4/30000_hf/TinyStoriesV2-GPT4-validation.npy"
#    test_dataset_path  : "shared/data/processed/tinystoriesv2-gpt4/30000_hf/TinyStoriesV2-GPT4-test.npy"

